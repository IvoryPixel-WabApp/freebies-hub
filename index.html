<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freebies | IvoryPixelWebApp</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #FAF9F6; /* สีครีมอ่อนมินิมอลแบบ Hey Morning Studio */
            color: #2D3732;
        }

        .serif-font {
            font-family: 'Playfair Display', serif;
        }

        /* ดีไซน์การ์ดสไตล์นุ่มนวล มีขอบมนและเงาละมุนแบบ Hey Morning Studio */
        .freebie-card {
            background-color: #FFFFFF;
            border: 1px solid #E5E7EB;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
            border-radius: 16px;
            transition: all 0.3s ease;
        }
        .freebie-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.06);
        }
        
        .primary-btn {
            background-color: #2D3732;
            color: white;
            transition: all 0.2s ease;
        }
        .primary-btn:hover {
            background-color: #404E47;
        }

        /* อนิเมชันแถบ Upsell สีพาสเทลไล่เฉดนุ่ม ๆ */
        .upsell-gradient {
            background: linear-gradient(270deg, #E8D7FF, #FFD6E8, #FFE9D1);
            background-size: 300% 300%;
            animation: gradient-shift 8s ease infinite;
            color: #2D3732;
        }
        @keyframes gradient-shift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .bar-grow {
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">

    <div id="root" class="flex-grow flex flex-col"></div>

    <script type="text/babel">
        const playClick = () => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(500, ctx.currentTime);
                gain.gain.setValueAtTime(0.05, ctx.currentTime);
                osc.start(); osc.stop(ctx.currentTime + 0.04);
            } catch(e) {}
        };

        const exportImg = async (id, name) => {
            playClick();
            const el = document.getElementById(id);
            const btn = document.getElementById('export-btn');
            if (btn) btn.style.display = 'none';
            
            const canvas = await html2canvas(el, { backgroundColor: '#FAF9F6', scale: 2 });
            const link = document.createElement('a');
            link.download = `${name}.png`;
            link.href = canvas.toDataURL();
            link.click();
            
            if (btn) btn.style.display = 'block';
        };

        function App() {
            // โครงสร้างคำนวณจากไฟล์เดิมของคุณ
            const [assets, setAssets] = React.useState({ cash: 5000, stocks: 2000, crypto: 500 });
            const [liabilities, setLiabilities] = React.useState({ debt: 1500 });
            const [calc, setCalc] = React.useState({ initial: 1000, monthly: 200, years: 10, rate: 8 });

            // State สำหรับดาวน์โหลด PDF
            const [pdfEmail, setPdfEmail] = React.useState('');
            const [pdfSuccess, setPdfSuccess] = React.useState(false);

            const totalAssets = Object.values(assets).reduce((a, b) => a + (parseFloat(b)||0), 0);
            const totalLiabilities = parseFloat(liabilities.debt) || 0;
            const netWorth = totalAssets - totalLiabilities;

            const r = calc.rate / 100;
            const n = 12;
            const t = calc.years;
            const P = parseFloat(calc.initial) || 0;
            const PMT = parseFloat(calc.monthly) || 0;
            
            const futureValue = (P * Math.pow(1 + r/n, n*t)) + (PMT * ((Math.pow(1 + r/n, n*t) - 1) / (r/n)));
            const totalInvested = P + (PMT * 12 * t);
            const totalInterest = futureValue - totalInvested;

            const handlePdfDownload = (e) => {
                e.preventDefault();
                if (!pdfEmail) return;
                playClick();
                setPdfSuccess(true);
                
                // ดาวน์โหลดไฟล์ PDF จำลอง
                const blob = new Blob(["Thank you for downloading the Gen Z Money Habits Guide from IvoryPixelWebApp!\nCheck out our premium systems: https://www.etsy.com/shop/IvoryPixelWebApp"], { type: "text/plain" });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = "Gen_Z_Money_Habits_Guide.pdf";
                link.click();
            };

            return (
                <div class="flex-grow flex flex-col">
                    
                    {/* --- แบนเนอร์โปรโมตสินค้าตัวเต็มด้านบนสุด --- */}
                    <div 
                        class="upsell-gradient p-3.5 text-center block sticky top-0 z-50 border-b border-rose-100"
                    >
                        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row items-center justify-center gap-2 sm:gap-4">
                            <span class="font-bold text-sm tracking-wide">
                                ✨ Want to fully automate your finances?
                            </span>
                            <a 
                                href="https://www.etsy.com/listing/4508370422/interactive-gen-z-financial-reset-web" 
                                target="_blank" 
                                onClick={playClick}
                                class="text-xs font-bold bg-[#D0E1F9] text-[#0E2F56] px-4 py-1.5 rounded-full tracking-wide shadow-sm hover:bg-[#B4D0F7] transition-all cursor-pointer"
                            >
                                Get The Gen Z Financial Reset Planner ➔
                            </a>
                        </div>
                    </div>

                    {/* --- ส่วนหัวเว็บสไตล์ Hey Morning Studio --- */}
                    <header class="max-w-6xl mx-auto w-full px-6 pt-16 pb-12 text-center space-y-4">
                        <div class="text-xs uppercase tracking-widest font-bold text-gray-400">IvoryPixelWebApp</div>
                        <h1 class="text-5xl md:text-6xl font-normal serif-font text-[#2D3732]">Freebies Hub</h1>
                        <p class="max-w-md mx-auto text-gray-500 font-light leading-relaxed">
                            Enjoy our curated collection of free financial visualizers and digital tools designed for your freedom.
                        </p>
                        
                        {/* Gen Z Money Habits Card */}
                        <div class="max-w-md mx-auto pt-8">
                            <div class="freebie-card overflow-hidden flex flex-col text-left">
                                <div class="p-6 flex-grow flex flex-col justify-between space-y-4">
                                    <div class="space-y-2">
                                        <span class="text-[10px] font-bold uppercase tracking-wider text-[#4B7355] bg-emerald-50 px-2.5 py-1 rounded-full">Free PDF Guide</span>
                                        <h3 class="text-xl font-bold text-[#2D3732]">Gen Z Money Habits</h3>
                                        <p class="text-gray-500 text-sm font-light">A mini checklist blueprint to audit your lifestyle expenses and reset your mindset.</p>
                                    </div>
                                    <div class="space-y-3 pt-2">
                                        {pdfSuccess ? (
                                            <div class="text-center py-3 bg-emerald-50 text-emerald-800 rounded-xl text-xs font-semibold border border-emerald-100">
                                                🎉 Sent to {pdfEmail}! Check inbox.
                                            </div>
                                        ) : (
                                            <form onSubmit={handlePdfDownload} class="space-y-2">
                                                <input 
                                                    type="email" 
                                                    placeholder="Enter your email" 
                                                    value={pdfEmail}
                                                    onChange={e => setPdfEmail(e.target.value)}
                                                    required
                                                    class="w-full px-3 py-2 border border-gray-200 rounded-xl text-xs bg-[#FAF9F6] focus:outline-none focus:border-[#4B7355] transition-colors"
                                                />
                                                <button 
                                                    type="submit" 
                                                    class="w-full text-center py-2.5 text-xs font-bold bg-[#C2E7D9] text-[#0F3B2E] rounded-xl uppercase tracking-wider block hover:bg-[#B0DACB] transition-colors cursor-pointer"
                                                >
                                                    Download Guide ➔
                                                </button>
                                            </form>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </header>

                    <main class="max-w-6xl mx-auto w-full px-6 pb-24 space-y-16">

                        {/* --- โซนเครื่องมือคำนวณเงินจากไฟล์ดั้งเดิม --- */}
                        <section id="interactive-tool" class="scroll-mt-24 max-w-4xl mx-auto space-y-8">
                            <div class="text-center space-y-2">
                                <h2 class="text-3xl font-normal serif-font">Wealth Visualizer Engine</h2>
                                <p class="text-sm text-gray-500 font-light">Simulate your future financial freedom trajectory below.</p>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-8" id="freebie-export-zone">
                                
                                {/* ตัวคำนวณสินทรัพย์ */}
                                <div class="bg-white border border-gray-200 rounded-2xl p-6 space-y-6">
                                    <h3 class="font-bold text-lg text-[#2D3732] border-b border-gray-100 pb-2">💰 Net Worth Tracker</h3>
                                    <div class="space-y-4">
                                        <div class="grid grid-cols-2 gap-4">
                                            <div>
                                                <label class="text-[11px] font-bold text-gray-500 block mb-1">Cash / Bank ($)</label>
                                                <input type="number" value={assets.cash} onChange={e => {playClick(); setAssets({...assets, cash: e.target.value})}} class="w-full p-2 border border-gray-200 rounded-lg bg-[#FAF9F6] text-sm focus:outline-none" />
                                            </div>
                                            <div>
                                                <label class="text-[11px] font-bold text-gray-500 block mb-1">Stocks / ETF ($)</label>
                                                <input type="number" value={assets.stocks} onChange={e => {playClick(); setAssets({...assets, stocks: e.target.value})}} class="w-full p-2 border border-gray-200 rounded-lg bg-[#FAF9F6] text-sm focus:outline-none" />
                                            </div>
                                        </div>
                                        <div>
                                            <label class="text-[11px] font-bold text-gray-500 block mb-1">Crypto / Others ($)</label>
                                            <input type="number" value={assets.crypto} onChange={e => {playClick(); setAssets({...assets, crypto: e.target.value})}} class="w-full p-2 border border-gray-200 rounded-lg bg-[#FAF9F6] text-sm focus:outline-none" />
                                        </div>
                                        <div>
                                            <label class="text-[11px] font-bold text-rose-600 block mb-1">Total Debts / Loans ($)</label>
                                            <input type="number" value={liabilities.debt} onChange={e => {playClick(); setLiabilities({debt: e.target.value})}} class="w-full p-2 border border-rose-100 rounded-lg bg-rose-50/50 text-sm focus:outline-none text-rose-700" />
                                        </div>
                                    </div>

                                    <div class="p-6 bg-[#E2ECE6] border border-[#CBE4DE] text-[#2D3732] rounded-xl text-center relative overflow-hidden">
                                        <span class="text-xs tracking-wider text-[#4B7355] block mb-1 uppercase font-bold">Calculated Net Worth</span>
                                        <span class="text-3xl font-extrabold">${netWorth.toLocaleString(undefined, {maximumFractionDigits:0})}</span>
                                    </div>

                                    {/* Asset Allocation Visual Bar */}
                                    {totalAssets > 0 && (
                                        <div class="space-y-2 pt-2">
                                            <div class="flex h-3 rounded-full overflow-hidden bg-gray-100">
                                                <div class="bg-[#E6A085] bar-grow" style={{width: `${((assets.cash||0)/totalAssets)*100}%`}}></div>
                                                <div class="bg-[#A7C4B5] bar-grow" style={{width: `${((assets.stocks||0)/totalAssets)*100}%`}}></div>
                                                <div class="bg-[#EED5A5] bar-grow" style={{width: `${((assets.crypto||0)/totalAssets)*100}%`}}></div>
                                            </div>
                                            <div class="flex justify-between text-[10px] font-bold text-gray-600 uppercase">
                                                <span>■ Cash (${(assets.cash||0).toLocaleString()})</span>
                                                <span>■ Stocks (${(assets.stocks||0).toLocaleString()})</span>
                                                <span>■ Crypto (${(assets.crypto||0).toLocaleString()})</span>
                                            </div>
                                        </div>
                                    )}
                                </div>

                                {/* ตัวคำนวณดอกเบี้ยทบต้น */}
                                <div class="bg-white border border-gray-200 rounded-2xl p-6 space-y-6">
                                    <h3 class="font-bold text-lg text-[#2D3732] border-b border-gray-100 pb-2">📈 Compound Simulator</h3>
                                    <div class="grid grid-cols-2 gap-4 text-sm">
                                        <div>
                                            <label class="text-[11px] font-bold text-gray-500 block mb-1">Initial ($)</label>
                                            <input type="number" value={calc.initial} onChange={e => {playClick(); setCalc({...calc, initial: e.target.value})}} class="w-full p-2 border border-gray-200 rounded-lg bg-[#FAF9F6] focus:outline-none" />
                                        </div>
                                        <div>
                                            <label class="text-[11px] font-bold text-gray-500 block mb-1">Monthly ($)</label>
                                            <input type="number" value={calc.monthly} onChange={e => {playClick(); setCalc({...calc, monthly: e.target.value})}} class="w-full p-2 border border-gray-200 rounded-lg bg-[#FAF9F6] focus:outline-none" />
                                        </div>
                                        <div>
                                            <label class="text-[11px] font-bold text-gray-500 block mb-1">Years</label>
                                            <input type="number" value={calc.years} onChange={e => {playClick(); setCalc({...calc, years: e.target.value})}} class="w-full p-2 border border-gray-200 rounded-lg bg-[#FAF9F6] focus:outline-none" />
                                        </div>
                                        <div>
                                            <label class="text-[11px] font-bold text-gray-500 block mb-1">Return (%)</label>
                                            <input type="number" value={calc.rate} onChange={e => {playClick(); setCalc({...calc, rate: e.target.value})}} class="w-full p-2 border border-gray-200 rounded-lg bg-[#FAF9F6] focus:outline-none" />
                                        </div>
                                    </div>

                                    <div class="p-5 bg-[#FAF9F6] border border-gray-200 rounded-xl text-center">
                                        <span class="text-xs text-gray-400 block">Estimated Future Balance</span>
                                        <div class="text-3xl font-extrabold text-[#2D3732] pt-1">${futureValue.toLocaleString(undefined, {maximumFractionDigits:0})}</div>
                                        
                                        <div class="mt-4 space-y-1">
                                            <div class="flex h-3 rounded-full overflow-hidden bg-gray-100">
                                                <div class="bg-[#E6A085] bar-grow" style={{width: `${(totalInvested/futureValue)*100}%`}}></div>
                                                <div class="bg-[#A7C4B5] bar-grow" style={{width: `${(totalInterest/futureValue)*100}%`}}></div>
                                            </div>
                                            <div class="flex justify-between text-[10px] text-gray-600 font-bold pt-1">
                                                <span>Saved: ${totalInvested.toLocaleString()}</span>
                                                <span>Interest: ${totalInterest.toLocaleString(undefined, {maximumFractionDigits:0})}</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </div>

                            {/* ปุ่มแชร์เซฟภาพ */}
                            <div class="flex justify-center" id="export-btn">
                                <button 
                                    onClick={() => exportImg('freebie-export-zone', 'My_Wealth_Vision')}
                                    class="px-6 py-3 bg-[#BEE3F8] text-[#1A365D] hover:bg-[#90CDF4] text-xs font-bold rounded-full uppercase tracking-widest shadow-sm flex items-center gap-2 transition-colors cursor-pointer"
                                >
                                    📸 Capture Wealth Vision
                                </button>
                            </div>
                        </section>

                    </main>

                    {/* ฟุตเตอร์เว็บ */}
                    <footer class="border-t border-gray-100 bg-white py-8 text-center text-xs text-gray-400 font-light">
                        © 2026 IvoryPixelWebApp. Created for aesthetic financial freedom.
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
